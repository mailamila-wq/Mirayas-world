<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7856ca"><title>Miraya's World 🌈</title><style>body{margin:0;background:#f7f3ff;color:#28304b;font:17px system-ui}header{text-align:center;background:linear-gradient(120deg,#7158ce,#f78caa);color:white;padding:26px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 6px 25px #36285d18}button,input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:2px solid #ded6f5}button{cursor:pointer;background:#7355cc;color:white;font-weight:bold;margin:5px}button:disabled{opacity:.5}input,select,textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0 14px}label{display:block;font-weight:600}.ghost{background:#ece6ff;color:#513b92}.danger{background:#ffdee2;color:#8b2033}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{background:#faf8ff;color:#483779;text-align:left;padding:20px}.choice{display:block;width:100%;background:#f0eaff;color:#46377a;text-align:left}.correct{background:#c9f3d8!important}.wrong{background:#ffd6dc!important}.muted{color:#646b81}nav{text-align:center;padding:12px}.q{border:1px solid #ddd4fa;padding:16px;border-radius:15px;margin:15px 0}h1{font-size:clamp(28px,6vw,46px)}.pill{background:#fff2bd;padding:12px;border-radius:14px}</style><header><h1>🌈 Miraya's World</h1><p>Explore · Learn · Shine ✨</p></header><nav><button onclick="tab('play')">🎮 Play</button><button onclick="tab('stars')">🏆 Stars</button><button onclick="tab('parent')">🔐 Parent</button></nav><main><section id="play"><div class="card"><h2>Choose an adventure 🚀</h2><div id="list" class="grid"></div></div><div id="game"></div></section><section id="stars" class="hidden"><div class="card"><h2>⭐ My achievements</h2><div id="results"></div><button class="ghost" onclick="backup()">Export progress</button></div></section><section id="parent" class="hidden"><div class="card"><h2>👨‍👧 Parent Exercise Builder</h2><div id="login"></div><div id="builder" class="hidden"><label>Activity title<input id="title" placeholder="Preposition Adventure"></label><label>Subject<select id="subject"><option>English</option><option>Maths</option><option>Science</option></select></label><label>Year<select id="year"><option>Year 1</option><option selected>Year 2</option><option>Year 3</option><option>Year 4</option></select></label><label>Game type<select id="type" onchange="draft=[];drawFields()"><option value="choice">Multiple choice</option><option value="blank">Fill in the blank</option><option value="boolean">True / False</option><option value="match">Matching pairs</option></select></label><div id="fields"></div><button class="ghost" onclick="addQ()">➕ Add question</button><button onclick="preview()">👀 Preview</button><button onclick="publish()">🚀 Publish</button><p id="status" role="status"></p><h3>Published exercises</h3><div id="manage"></div><button class="ghost" onclick="logout()">Sign out</button></div></div></section></main><script src="config.js"></script><script>
const $=id=>document.getElementById(id),c=window.MIRAYA_CONFIG||{},ready=!!(c.url&&c.anonKey),safe=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));let token='',uid='',draft=[],editId=null,rows=[],all=[],active=null,n=0,score=0,done=false,matches=[];
const demo=[{id:'demo1',title:'Preposition Adventure',subject:'English',year:'Year 2',type:'choice',questions:[{prompt:'The cat is sitting ___ the chair.',options:['in','on','at','between'],answer:'on'},{prompt:'We meet ___ the gate.',options:['in','on','at','above'],answer:'at'}]},{id:'demo2',title:'Number Quest',subject:'Maths',year:'Year 2',type:'blank',questions:[{prompt:'7 + 5 = ?',answer:'12'},{prompt:'15 - 8 = ?',answer:'7'}]},{id:'demo3',title:'Science Sparks',subject:'Science',year:'Year 2',type:'boolean',questions:[{prompt:'The Sun is a star.',answer:'True'},{prompt:'Fish breathe using lungs.',answer:'False'}]}];
function tab(id){['play','stars','parent'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='stars')showStars()}function progress(){try{return JSON.parse(localStorage.getItem('miraya-stars')||'{}')}catch{return {}}}function showStars(){const p=progress();$('results').innerHTML='<p class="pill">Total stars: '+Object.values(p).reduce((a,b)=>a+b.score,0)+' ⭐</p>'+Object.entries(p).map(([k,v])=>'<p>'+safe(all.find(a=>String(a.id)===k)?.title||'Activity')+': '+v.score+'/'+v.total+'</p>').join('')}function backup(){const b=new Blob([JSON.stringify(progress(),null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='miraya-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function request(path,method='GET',body,authenticated=false){let h={'apikey':c.anonKey,'Content-Type':'application/json'};if(authenticated)h.Authorization='Bearer '+token;let r=await fetch(c.url.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});let t=await r.text(),d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||d?.msg||'HTTP '+r.status);return d}
async function load(){all=[...demo];if(ready)try{const remote=await request('/rest/v1/activities?select=*&published=eq.true&order=created_at.desc');all=[...remote,...demo]}catch(e){console.warn(e)}$('list').innerHTML=all.map((a,i)=>'<button class="tile" onclick="start('+i+')"><h3>'+(a.subject==='English'?'📚':a.subject==='Maths'?'🔢':'🔬')+' '+safe(a.title)+'</h3>'+safe(a.subject)+' · '+safe(a.year)+'<p>'+a.questions.length+' questions →</p></button>').join('')}
function start(i){active=all[i];n=0;score=0;tab('play');drawGame();$('game').scrollIntoView({behavior:'smooth'})}function drawGame(){done=false;matches=[];let q=active.questions[n];if(!q){const p=progress();p[String(active.id)]={score,total:active.questions.length};localStorage.setItem('miraya-stars',JSON.stringify(p));$('game').innerHTML='<div class="card"><h2>🎉 Great work!</h2><p>You earned '+score+' ⭐ out of '+active.questions.length+'</p><button onclick="start(all.indexOf(active))">Play again</button></div>';return}let body='';if(active.type==='choice'||active.type==='boolean'){(active.type==='boolean'?['True','False']:q.options).forEach(o=>body+='<button class="choice" onclick="choose(this,'+JSON.stringify(o).replace(/"/g,'&quot;')+')">'+safe(o)+'</button>')}if(active.type==='blank')body='<input id="answer" placeholder="Type your answer"><button onclick="checkText()">Check</button>';if(active.type==='match')body='<p>Tap a word on the left, then its match on the right.</p><div class="grid" style="grid-template-columns:1fr 1fr"><div>'+q.pairs.map((p,i)=>'<button id="l'+i+'" class="choice" onclick="match(0,'+i+')">'+safe(p.left)+'</button>').join('')+'</div><div>'+q.pairs.map((p,i)=>'<button id="r'+i+'" class="choice" onclick="match(1,'+i+')">'+safe(p.right)+'</button>').join('')+'</div></div>';$('game').innerHTML='<div class="card"><p class="muted">'+safe(active.title)+' · '+(n+1)+'/'+active.questions.length+'</p><h2>'+safe(q.prompt)+'</h2>'+body+'<p id="feedback" aria-live="polite"></p><button id="next" class="hidden" onclick="n++;drawGame()">Next ➜</button></div>'}function finish(ok){if(done)return;done=true;if(ok)score++;$('feedback').textContent=ok?'🌟 Correct! +1 star':'💪 Good try! Correct answer: '+(active.type==='match'?'review the pairs':active.questions[n].answer);$('next').classList.remove('hidden')}function choose(el,val){if(done)return;const ok=val===active.questions[n].answer;el.classList.add(ok?'correct':'wrong');finish(ok)}function checkText(){let v=$('answer').value.trim().toLowerCase();if(v)finish(v===String(active.questions[n].answer).trim().toLowerCase())}let chosen=null;function match(side,i){if(done||matches.includes(i))return;if(side===0){chosen=i;$('feedback').textContent='Now tap its partner.'}else if(chosen!==null){if(chosen===i){matches.push(i);$('l'+i).classList.add('correct');$('r'+i).classList.add('correct');$('l'+i).disabled=$('r'+i).disabled=true;$('feedback').textContent='Nice match!';if(matches.length===active.questions[n].pairs.length)finish(true)}else $('feedback').textContent='Try another pair.';chosen=null}}
function authUI(){if(!ready){$('login').innerHTML='<p class="pill">Demo mode. Add your Supabase URL and publishable key to config.js to enable the Parent Dashboard.</p>';return}if(!token){$('builder').classList.add('hidden');$('login').innerHTML='<label>Parent email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button onclick="login()">Sign in</button><p id="loginError"></p>';return}$('login').innerHTML='<p>🔓 Parent signed in</p>';$('builder').classList.remove('hidden');drawFields();manage()}async function login(){try{let d=await request('/auth/v1/token?grant_type=password','POST',{email:$('email').value,password:$('password').value});token=d.access_token;uid=d.user.id;authUI()}catch(e){$('loginError').textContent=e.message}}function logout(){token='';uid='';authUI()}
function sync(){document.querySelectorAll('[data-i]').forEach(el=>{let q=draft[+el.dataset.i],k=el.dataset.key;if(k==='options')q.options=el.value.split('\n').map(x=>x.trim()).filter(Boolean);else if(k==='pairs')q.pairs=el.value.split('\n').filter(x=>x.includes('|')).map(x=>{let [left,right]=x.split('|');return{left:left.trim(),right:right.trim()}});else q[k]=el.value})}function addQ(){sync();draft.push($('type').value==='match'?{prompt:'Match the pairs',pairs:[]}:$('type').value==='choice'?{prompt:'',options:[],answer:''}:{prompt:'',answer:$('type').value==='boolean'?'True':''});drawFields()}function removeQ(i){sync();draft.splice(i,1);drawFields()}function drawFields(){if(!$('fields'))return;let type=$('type').value;$('fields').innerHTML=draft.map((q,i)=>'<div class="q"><b>Question '+(i+1)+'</b><button class="danger" onclick="removeQ('+i+')">Remove</button><label>Question<input data-i="'+i+'" data-key="prompt" value="'+safe(q.prompt)+'"></label>'+(type==='choice'?'<label>Options, one per line<textarea data-i="'+i+'" data-key="options">'+safe((q.options||[]).join('\n'))+'</textarea></label><label>Correct option<input data-i="'+i+'" data-key="answer" value="'+safe(q.answer)+'"></label>':type==='match'?'<label>Pairs, one per line: item | match<textarea data-i="'+i+'" data-key="pairs">'+safe((q.pairs||[]).map(p=>p.left+' | '+p.right).join('\n'))+'</textarea></label>':type==='boolean'?'<label>Answer<select data-i="'+i+'" data-key="answer"><option '+(q.answer==='True'?'selected':'')+'>True</option><option '+(q.answer==='False'?'selected':'')+'>False</option></select></label>':'<label>Answer<input data-i="'+i+'" data-key="answer" value="'+safe(q.answer)+'"></label>')+'</div>').join('');document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',sync))}function collect(){sync();let a={title:$('title').value.trim(),subject:$('subject').value,year:$('year').value,type:$('type').value,questions:structuredClone(draft),published:true};if(!a.title||!draft.length)throw Error('Add a title and questions.');for(let q of draft){if(!q.prompt?.trim())throw Error('Every question needs text.');if(a.type==='choice'&&(!q.options||q.options.length<2||!q.options.includes(q.answer)))throw Error('Each multiple-choice answer must match an option.');if(a.type==='blank'&&!q.answer?.trim())throw Error('Add the correct answer.');if(a.type==='match'&&(!q.pairs||q.pairs.length<2||q.pairs.some(p=>!p.left||!p.right)))throw Error('Add at least two complete matching pairs.')}return a}function preview(){try{let a=collect();all.unshift({...a,id:'preview-'+Date.now()});start(0)}catch(e){$('status').textContent=e.message}}async function publish(){try{let a=collect();a.created_by=uid;if(!uid)throw Error('Sign in first.');if(editId)await request('/rest/v1/activities?id=eq.'+encodeURIComponent(editId),'PATCH',a,true);else await request('/rest/v1/activities','POST',a,true);$('status').textContent='🎉 Published!';editId=null;draft=[];$('title').value='';drawFields();await load();await manage()}catch(e){$('status').textContent=e.message}}async function manage(){try{rows=await request('/rest/v1/activities?select=*&order=created_at.desc','GET',null,true);$('manage').innerHTML=rows.map((r,i)=>'<p>'+safe(r.title)+' <button class="ghost" onclick="edit('+i+')">Edit</button><button class="danger" onclick="del('+i+')">Delete</button></p>').join('')||'No exercises yet.'}catch(e){$('manage').textContent=e.message}}function edit(i){let a=rows[i];editId=a.id;$('title').value=a.title;$('subject').value=a.subject;$('year').value=a.year;$('type').value=a.type;draft=structuredClone(a.questions);drawFields()}async function del(i){if(!confirm('Delete this exercise?'))return;try{await request('/rest/v1/activities?id=eq.'+encodeURIComponent(rows[i].id),'DELETE',null,true);await manage();await load()}catch(e){alert(e.message)}}authUI();load();
</script></html>
