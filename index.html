<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8665db"><meta name="apple-mobile-web-app-capable" content="yes"><title>Miraya's World ✨</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#302954;background:#f8f5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#ffe3f2,transparent 40%),radial-gradient(circle at top right,#d9f7ff,transparent 45%),#faf7ff;min-height:100vh}.wrap{max-width:940px;margin:auto;padding:25px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(29px,5vw,49px);margin:12px 0 5px}.muted{color:#716b88}.pill{border-radius:30px;background:white;padding:12px 17px;box-shadow:0 4px 16px #50428512;font-weight:800}.hero{padding:22px 0 25px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border:0;text-align:left;padding:23px;border-radius:25px;min-height:155px;box-shadow:0 8px 20px #49376a13;cursor:pointer;color:#302954}.card b{font-size:22px;display:block;margin:10px 0 5px}.card span{font-size:40px}.pink{background:#ffe3ef}.blue{background:#ddf2ff}.green{background:#dff8e7}.yellow{background:#fff1c8}.purple{background:#ebe2ff}.white{background:white}.card:active,button:active{transform:scale(.98)}button{font:inherit}.action{border:0;background:#7857d5;color:white;padding:13px 21px;border-radius:16px;font-weight:800;cursor:pointer}.secondary{background:#eee8fc;color:#513c92}.panel{background:white;padding:24px;border-radius:25px;box-shadow:0 7px 24px #49376a10;margin-top:18px}.hidden{display:none}#options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{padding:17px;border:2px solid #e3dcf7;background:#faf8ff;border-radius:15px;text-align:left;cursor:pointer;min-height:60px}.option.selected{border-color:#7857d5;background:#e9e1ff}.option.correct{border-color:#31a66b;background:#e0f8e9}.option.wrong{border-color:#db5b7c;background:#ffe5ed}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.progress{height:12px;background:#eee8fc;border-radius:20px;overflow:hidden}.bar{height:100%;background:#8d6be8;width:0;transition:width .3s}.feedback{font-weight:800;min-height:26px}.tiny{font-size:13px}.badges{display:flex;gap:12px;flex-wrap:wrap}.badge{background:#f2ecff;padding:13px;border-radius:15px}.footer{margin-top:25px;text-align:center;color:#827b98}@media(max-width:520px){.cards{gap:11px}.card{padding:16px;min-height:140px}.card b{font-size:17px}#options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><div class="pill">🌈 Miraya's World</div><div class="pill" id="stars">⭐ 0 stars</div></header><section class="hero"><h1>Hi, Miraya! 👋</h1><p class="muted">Ready to discover something amazing today?</p></section><section id="home"><div class="cards"><button class="card pink" onclick="openArea('english')"><span>📚</span><b>English Kingdom</b>Grammar, words & stories</button><button class="card blue" onclick="openArea('maths')"><span>🔢</span><b>Maths Mountain</b>Numbers & puzzles</button><button class="card green" onclick="openArea('science')"><span>🔬</span><b>Science Lab</b>Nature & discoveries</button><button class="card yellow" onclick="openArea('creative')"><span>🎨</span><b>Creative Corner</b>Imagination time</button><button class="card purple" onclick="openArea('achievements')"><span>🏆</span><b>My Achievements</b>See your progress</button><button class="card white" onclick="openArea('parent')"><span>🔐</span><b>Parent Corner</b>Backup & restore</button></div></section><section id="activity" class="panel hidden"><div class="row"><button class="action secondary" onclick="goHome()">← Home</button><span id="counter" class="muted"></span></div><h2 id="activityTitle"></h2><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question" style="margin-top:26px"></h2><div id="options"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next" class="action hidden" onclick="nextQuestion()">Next →</button><div id="extras"></div></section><div class="footer">Made for curious minds ✨</div></main><script>const KEY='mirayas-world-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{stars:0,results:{}}}catch{data={stars:0,results:{}}}function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('stars').textContent='⭐ '+data.stars+' stars'}save();const sets={english:{title:'📚 Preposition Adventure',questions:[['That man is sitting ___ the car.',['in','over','below','between'],0,'We sit in a car.'],['She is reading her book ___ the light.',['on','above','under','ahead'],2,'She reads under the light.'],['Can you find my phone ___ the bag?',['in','on','at','over'],0,'The phone is inside the bag.'],['Shall we wait for the bus ___ the bus stop?',['at','in','on','under'],0,'We wait at a bus stop.'],['The book is ___ the table.',['in','at','on','over'],2,'The book rests on the table.'],['I will meet you ___ the gate.',['in','at','on','above'],1,'We meet at the gate.']]},maths:{title:'🔢 Maths Mountain',questions:[['What is 7 + 8?',['13','14','15','16'],2,'7 + 8 = 15'],['What is 20 − 6?',['12','14','16','18'],1,'20 − 6 = 14'],['What is 4 × 3?',['7','10','12','14'],2,'4 groups of 3 make 12.'],['What is half of 18?',['8','9','10','12'],1,'18 ÷ 2 = 9'],['What comes next: 5, 10, 15, ...?',['16','18','20','25'],2,'Add 5 each time.']]},science:{title:'🔬 Science Lab',questions:[['Which planet is known as the Red Planet?',['Earth','Mars','Venus','Neptune'],1,'Mars looks reddish because of iron-rich dust.'],['What do plants absorb from sunlight?',['Light energy','Sand','Plastic','Moonlight'],0,'Plants use light energy to make food.'],['Which animal is a mammal?',['Shark','Frog','Dolphin','Butterfly'],2,'Dolphins breathe air and feed their babies milk.'],['What do we call water turning into vapour?',['Freezing','Evaporation','Melting','Condensation'],1,'Evaporation changes liquid water into vapour.'],['Which part of a plant takes up water?',['Flower','Fruit','Roots','Seeds'],2,'Roots absorb water from soil.']]}};let area='',idx=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){ $('home').classList.add('hidden');$('activity').classList.remove('hidden');$('extras').innerHTML='';$('feedback').textContent='';$('next').classList.add('hidden')}function goHome(){$('home').classList.remove('hidden');$('activity').classList.add('hidden')}function openArea(a){area=a;show();if(sets[a]){idx=0;score=0;renderQuestion()}else if(a==='achievements'){let completed=Object.keys(data.results).length;$('activityTitle').textContent='🏆 My Achievements';$('question').textContent='Your learning journey';$('counter').textContent='';$('bar').style.width='100%';$('options').innerHTML='';$('extras').innerHTML='<div class="badges"><div class="badge">⭐ '+data.stars+' total stars</div><div class="badge">🎯 '+completed+' subjects tried</div></div><p>'+Object.entries(data.results).map(([k,v])=>sets[k].title+': best '+v+'/'+sets[k].questions.length).join('<br>')+'</p>'}else if(a==='creative'){$('activityTitle').textContent='🎨 Creative Corner';$('question').textContent='Your imagination challenge';$('counter').textContent='';$('bar').style.width='0';$('options').innerHTML='';$('extras').innerHTML='<p>Draw a magical animal that lives in a rainbow forest. Give it a name and write three things it can do! ✨</p><p>Use paper and pencils. More creative activities are coming soon.</p>'}else{$('activityTitle').textContent='🔐 Parent Corner';$('question').textContent='Keep Miraya’s progress safe';$('counter').textContent='';$('options').innerHTML='';$('bar').style.width='0';$('extras').innerHTML='<p class="muted">Progress stays in this browser on this device. Export a backup occasionally, especially before clearing Safari data.</p><button class="action" onclick="backup()">⬇ Export progress</button> <label class="action secondary" style="display:inline-block;margin-top:10px">⬆ Import progress<input type="file" accept="application/json" style="display:none" onchange="restore(event)"></label><p class="tiny">Import replaces the current progress on this device.</p>'}}function renderQuestion(){answered=false;let set=sets[area],q=set.questions[idx];$('activityTitle').textContent=set.title;$('counter').textContent='Question '+(idx+1)+' of '+set.questions.length;$('bar').style.width=(idx/set.questions.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');$('options').innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(i,b);$('options').appendChild(b)})}function answer(i,b){if(answered)return;answered=true;let q=sets[area].questions[idx];document.querySelectorAll('.option').forEach((el,j)=>{el.disabled=true;if(j===q[2])el.classList.add('correct')});if(i===q[2]){score++;$('feedback').textContent='🌟 Correct! '+q[3]}else{b.classList.add('wrong');$('feedback').textContent='💡 Nice try! '+q[3]}$('next').classList.remove('hidden');$('next').textContent=idx===sets[area].questions.length-1?'See results 🎉':'Next →'}function nextQuestion(){idx++;if(idx<sets[area].questions.length)renderQuestion();else finish()}function finish(){let set=sets[area];$('bar').style.width='100%';$('counter').textContent='Finished!';$('question').textContent='🎉 Mission complete!';$('options').innerHTML='';$('feedback').textContent='You scored '+score+' out of '+set.questions.length+'!';$('next').classList.add('hidden');let old=data.results[area]||0;let gain=Math.max(0,score-old);data.results[area]=Math.max(old,score);data.stars+=gain;save();$('extras').innerHTML='<p>⭐ '+gain+' new stars earned. Your best score is saved!</p><button class="action" onclick="openArea(\''+area+'\')">Play again ↻</button>'}function backup(){let blob=new Blob([JSON.stringify({app:'Mirayas World',version:1,data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mirayas-world-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='Mirayas World'||typeof obj.data?.stars!=='number'||!obj.data?.results)throw Error();if(confirm('Replace saved progress with this backup?')){data=obj.data;save();alert('Progress restored!')}}catch{alert('This is not a valid Miraya’s World backup file.')}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
